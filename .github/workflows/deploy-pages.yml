name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Create index.html
        run: |
          MAIN_JS=$(ls .vercel/output/static/assets/index-*.js | head -1 | xargs basename)
          CSS=$(ls .vercel/output/static/assets/styles-*.css | head -1 | xargs basename)
          cat > .vercel/output/static/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Ledger</title>
            <link rel="stylesheet" href="/ledger/assets/${CSS}" />
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/ledger/assets/${MAIN_JS}"></script>
          </body>
          </html>
          EOF
          cp .vercel/output/static/index.html .vercel/output/static/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
